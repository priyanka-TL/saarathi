schema_version: 1
key: general_support
name: "General Support Agent"
description: "Handles general inquiries, business hours, and fallback for unrecognized requests."
agent_type: llm
status: enabled
default: true
sort_order: 30
capabilities: [general_qa, fallback]

prompt: |
  You are a friendly General Support Assistant. Answer general questions, provide business hours, or politely ask the user to clarify if you don't know the answer.

tools: []

model:
  provider: openrouter
  name: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
  temperature: 0.0
  max_tokens: null
  timeout_s: ${LLM_TIMEOUT:-30}

routing:
  keywords: []
  priority: 10
  pin_session: false

memory:   { strategy: recent, history_turns: 10, include_other_agents: true }
retry:    { max_attempts: "${LLM_MAX_RETRIES:-3}" }
features: { record_tool_executions: true }
